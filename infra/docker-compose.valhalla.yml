# GOBA Maps - 自架 Valhalla 路線引擎（台灣 OSM 圖資正式部署設定）
# 映像版本已固定為 3.5.1，確保跨環境一致性與可重複部署。
# 建議硬體規格：2 vCPU / 4 GB RAM / 20 GB SSD（請部署於獨立導航節點，勿與 1GB RAM 主站混用）

services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:3.5.1
    container_name: goba-valhalla-taiwan
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./valhalla_data:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - force_rebuild_elevation=False
      - build_elevation=False
      - build_admins=True
      - build_time_zones=True
      - serve_tiles=True
      - server_threads=2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
