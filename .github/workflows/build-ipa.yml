name: Build iOS IPA (For Sideloadly)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA for iOS
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r -y 鍋巴GOBA.ipa Payload
          echo "IPA packaging finished. File info:"
          ls -lh 鍋巴GOBA.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 鍋巴GOBA-ipa
          path: 鍋巴GOBA.ipa
          retention-days: 7
